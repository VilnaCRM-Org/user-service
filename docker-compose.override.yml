# Development environment override
services:
  php:
    build:
      target: frankenphp_dev
    volumes:
      - ./:/srv/app
      - ./infrastructure/docker/php/conf.d/app.dev.ini:/usr/local/etc/php/conf.d/app.dev.ini:ro
      - ./infrastructure/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infrastructure/docker/php/worker.Caddyfile:/etc/caddy/worker.Caddyfile:ro
      - valkey_iam_tls:/run/valkey-iam-tls:ro
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /srv/app/vendor
    environment:
      APP_ENV: '${APP_ENV:-dev}'
      APP_DEBUG: '${APP_DEBUG:-1}'
      CADDY_PHP_APP_ENV: '${APP_ENV:-dev}'
      CADDY_PHP_APP_DEBUG: '${APP_DEBUG:-1}'
      FRANKENPHP_CONFIG: import worker.Caddyfile
      FRANKENPHP_LOOP_MAX: ${FRANKENPHP_LOOP_MAX:-500}
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: '${XDEBUG_MODE:-off}'
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    networks:
      - user-service
    ports:
      - target: 8081
        published: ${PHP_DEV_PORT:-8081}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

  app-prod:
    networks:
      - user-service

  ###> symfony/mailer ###
  mailer:
    image: schickling/mailcatcher
    ports:
      - '${MAILCATCHER_SMTP_PORT}:1025'
      - '${MAILCATCHER_HTTP_PORT}:1080'
    networks:
      - user-service
  ###< symfony/mailer ###

  database:
    networks:
      - user-service

  workers:
    networks:
      - user-service

  redis:
    networks:
      - user-service

  # Test-only TLS + ACL Valkey 7.2 for the Redis IAM token provider (S5.13).
  valkey-iam:
    image: valkey/valkey:7.2.14-alpine@sha256:c6c2f0020be34bbf684a53a0ef716ab16ff70295186d4d9f2518435beb7afbff
    entrypoint: ['/bin/sh', '/usr/local/bin/valkey-iam-entrypoint.sh']
    volumes:
      - ./infrastructure/docker/valkey-iam/entrypoint.sh:/usr/local/bin/valkey-iam-entrypoint.sh:ro
      - valkey_iam_tls:/tls
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cat /tls/admin.password)" valkey-cli -h 127.0.0.1 --tls --cacert /tls/ca.crt --user admin --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - user-service

  localstack:
    image: localstack/localstack:3.4.0
    ports:
      - '${LOCALSTACK_PORT}:4566'
    environment:
      - SERVICES=sqs
      - DEBUG=1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infrastructure/docker/php/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    networks:
      - user-service

  structurizr:
    image: structurizr/lite
    ports:
      - '${STRUCTURIZR_PORT}:8080'
    volumes:
      - ./:/usr/local/structurizr
    networks:
      - user-service

networks:
  user-service:

volumes:
  localstack_data:
  valkey_iam_tls:
