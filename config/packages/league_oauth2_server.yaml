league_oauth2_server:
  authorization_server: # Required
    # S5.11 (FR-06): access tokens are signed by AWS KMS, so no private key file
    # exists. The bundle requires a value; KmsJwtSigningCompilerPass replaces the
    # CryptKey built from it with a key-less KmsCryptKey.
    private_key: 'aws-kms'

    # The plain string or the ascii safe string used to create a Defuse\Crypto\Key to be used as an encryption key.
    # How to generate an encryption key: https://oauth2.thephpleague.com/installation/#string-password
    encryption_key: '%env(resolve:OAUTH_ENCRYPTION_KEY)%' # Required

    # The type of value of 'encryption_key'
    encryption_key_type: '%env(resolve:OAUTH_ENCRYPTION_KEY_TYPE)%' # One of "plain"; "defuse"

    # How long the issued access token should be valid for.
    # The value should be a valid interval: http://php.net/manual/en/dateinterval.construct.php#refsect1-dateinterval.construct-parameters
    access_token_ttl: '%env(resolve:ACCESS_TOKEN_TTL)%'

    # How long the issued refresh token should be valid for.
    # The value should be a valid interval: http://php.net/manual/en/dateinterval.construct.php#refsect1-dateinterval.construct-parameters
    refresh_token_ttl: '%env(resolve:REFRESH_TOKEN_TTL)%'

    # How long the issued auth code should be valid for.
    # The value should be a valid interval: http://php.net/manual/en/dateinterval.construct.php#refsect1-dateinterval.construct-parameters
    auth_code_ttl: '%env(resolve:AUTH_CODE_TTL)%'

    # Whether to enable the client credentials grant
    enable_client_credentials_grant: true

    # Whether to enable the password grant
    enable_password_grant: true

    # Whether to enable the refresh token grant
    enable_refresh_token_grant: true

    # Whether to enable the authorization code grant
    enable_auth_code_grant: true

    # Whether to enable the implicit grant (deprecated per OAuth 2.0 specs) — NFR-64: disabled
    enable_implicit_grant: false

    # Whether to require code challenge for public clients for the auth code grant
    require_code_challenge_for_public_clients: true

    # Whether to enable access token saving to persistence layer (default to true)
    persist_access_token: '%env(bool:OAUTH_PERSIST_ACCESS_TOKEN)%'

  resource_server: # Required
    # S5.11 (FR-06): bearer tokens are verified with the KMS public keys
    # (KmsBearerTokenValidator); KmsJwtSigningCompilerPass replaces this value.
    public_key: 'aws-kms'

  scopes:
    # Scopes that you wish to utilize in your application.
    # This should be a simple array of strings.
    available: ['email', 'profile']

    # Scopes that will be assigned when no scope given.
    # This should be a simple array of strings.
    default: ['email']

  # Configures different persistence methods that can be used by the bundle for saving client and token data.
  # Only one persistence method can be configured at a time.
  persistence: # Required
    custom:
      client_manager: App\OAuth\Infrastructure\Adapter\ClientManager
      access_token_manager: App\OAuth\Infrastructure\Adapter\AccessTokenManager
      refresh_token_manager: App\OAuth\Infrastructure\Adapter\RefreshTokenManager
      authorization_code_manager: App\OAuth\Infrastructure\Adapter\AuthorizationCodeManager
      credentials_revoker: App\OAuth\Infrastructure\Adapter\CredentialsRevoker

  # Set a custom prefix that replaces the default 'ROLE_OAUTH2_' role prefix
  role_prefix: ROLE_OAUTH2_

  client:
    # Set a custom client class. Must be a League\Bundle\OAuth2ServerBundle\Model\Client
    classname: League\Bundle\OAuth2ServerBundle\Model\Client

when@test:
  league_oauth2_server:
    authorization_server:
      encryption_key_type: plain
