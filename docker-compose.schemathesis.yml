services:
  php:
    build:
      target: frankenphp_prod
    # This harness bind-mounts the host checkout and installs dependencies, assets
    # and keys into it, so it keeps the root user and the development listeners.
    user: '0:0'
    command:
      - frankenphp
      - run
      - --config
      - /etc/caddy/Caddyfile
    ports: !override
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - target: 8081
        published: ${SCHEMATHESIS_API_PORT:-8081}
        protocol: tcp
    volumes:
      - ./:/srv/app
      - /srv/app/vendor
      - ./infrastructure/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infrastructure/docker/php/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint:ro
      - ./infrastructure/docker/php/worker.Caddyfile:/etc/caddy/worker.Caddyfile:ro
    environment:
      APP_ENV: schemathesis
      CADDY_PHP_APP_ENV: schemathesis
      FRANKENPHP_CONFIG: import worker.Caddyfile
      FRANKENPHP_LOOP_MAX: ${FRANKENPHP_LOOP_MAX:-500}
      SERVER_NAME: :80
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8081/api/docs >/dev/null || exit 1']
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 120s

  mailer:
    image: schickling/mailcatcher
    ports:
      - '${MAILCATCHER_SMTP_PORT}:1025'
      - '${MAILCATCHER_HTTP_PORT}:1080'

  localstack:
    image: localstack/localstack:3.4.0
    ports:
      - '${LOCALSTACK_PORT:-4566}:4566'
    environment:
      - SERVICES=sqs
      - DEBUG=1
    volumes:
      - ./infrastructure/docker/php/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
