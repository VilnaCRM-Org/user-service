# Production environment override
services:
  php:
    environment:
      APP_SECRET: ${APP_SECRET}
      FRANKENPHP_CONFIG: import worker.Caddyfile
      FRANKENPHP_LOOP_MAX: ${FRANKENPHP_LOOP_MAX:-500}
      PASSKEY_PRODUCTION_TRAFFIC_ENABLED: ${PASSKEY_PRODUCTION_TRAFFIC_ENABLED:-false}
      PASSKEY_PRODUCTION_MONITORING_READY: ${PASSKEY_PRODUCTION_MONITORING_READY:-false}
