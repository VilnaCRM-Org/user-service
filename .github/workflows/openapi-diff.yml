name: openapi-diff

on:
  pull_request:
    branches: ['main']

jobs:
  openapi-diff:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - name: Dependabot skip
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "Skipping OpenAPI diff for Dependabot PR"

      - uses: shivammathur/setup-php@v2
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          php-version: ${{ vars.PHP_VERSION }}

      - uses: actions/checkout@v4
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Copy .env.test.local
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"

      - name: Cache Composer packages
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Dependencies
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate openapi spec
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          php bin/console --env=test api:openapi:export --yaml --output=.github/openapi-spec/spec.yaml
          npx --yes prettier@3.5.3 --write --ignore-path /dev/null .github/openapi-spec/spec.yaml

      - name: Verify OpenAPI spec is up-to-date
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          git diff --exit-code .github/openapi-spec/spec.yaml || {
            echo "::error::OpenAPI specification is out of date. Run 'make generate-openapi-spec' (or 'php bin/console --env=test api:openapi:export --yaml --output=.github/openapi-spec/spec.yaml && npx prettier@3.5.3 --write --ignore-path /dev/null .github/openapi-spec/spec.yaml') and commit the resulting .github/openapi-spec/spec.yaml."
            exit 1
          }

      - name: Check out head branch
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: actions/checkout@v4
        with:
          path: head

      - name: Check out base branch (main)
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: actions/checkout@v4
        with:
          ref: main
          path: base

      - name: Run OpenAPI Diff (base -> head)
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: docker://openapitools/openapi-diff:latest
        with:
          args: '--fail-on-incompatible /github/workspace/base/.github/openapi-spec/spec.yaml /github/workspace/head/.github/openapi-spec/spec.yaml'

      - uses: actions/upload-artifact@v4
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          name: diff-reports
          path: ./output
