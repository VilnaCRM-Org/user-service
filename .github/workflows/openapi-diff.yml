name: openapi-diff

on:
  pull_request:
    branches: ['main']

jobs:
  openapi-diff:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: Dependabot skip
        if: github.actor == 'dependabot[bot]'
        run: echo "Skipping OpenAPI diff for Dependabot PR"

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        if: ${{ github.actor != 'dependabot[bot]' }}
        with:
          php-version: ${{ vars.PHP_VERSION }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ github.actor != 'dependabot[bot]' }}
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Copy .env.test.local
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"

      - name: Cache Composer packages
        if: ${{ github.actor != 'dependabot[bot]' }}
        id: composer-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Dependencies
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate openapi spec
        if: ${{ github.actor != 'dependabot[bot]' }}
        run: php bin/console --env=test api:openapi:export --yaml --output=.github/openapi-spec/spec.yaml

      - name: Commit changes
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5
        with:
          add: '.github/openapi-spec/spec.yaml'
          message: 'feat(#${{ toJSON(github.event.number) }}): generate openapi spec'

      - name: Check out head branch
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: head

      - name: Check out master branch
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          path: base

      - name: Run OpenAPI Diff (from HEAD revision)
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: docker://openapitools/openapi-diff@sha256:9b5bfb7ff04710ac605b1f8d12706b536682ff80c178a4db6b744024b93fccf5
        with:
          args: '/github/workspace/head/.github/openapi-spec/spec.yaml /github/workspace/base/.github/openapi-spec/spec.yaml'

      - uses: actions/upload-artifact@v4
        if: ${{ github.actor != 'dependabot[bot]' }}
        with:
          name: diff-reports
          path: ./output
