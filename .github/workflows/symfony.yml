name: checks

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  symfony-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot skip
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "Skipping symfony checks for Dependabot PR"

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          php-version: ${{ vars.PHP_VERSION }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          persist-credentials: false

      - name: Copy .env.test.local
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"

      - name: Cache Composer packages
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        id: composer-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Dependencies
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Symfony CLI
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if wget https://get.symfony.com/cli/installer -O - | bash; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Composer validate
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: composer validate

      - name: Check symfony requirements
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: /home/runner/.symfony5/bin/symfony check:requirements

      - name: Symfony security check
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: /home/runner/.symfony5/bin/symfony security:check
