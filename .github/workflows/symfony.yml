name: checks

on:
  pull_request:
    branches: ['main']

jobs:
  symfony-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot skip
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "Skipping symfony checks for Dependabot PR"

      - uses: shivammathur/setup-php@v2
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          php-version: ${{ vars.PHP_VERSION }}

      - uses: actions/checkout@v4
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}

      - name: Copy .env.test.local
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: php -r "file_exists('.env.test.local') || copy('.env.test', '.env.test.local');"

      - name: Cache Composer packages
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Dependencies
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Symfony CLI
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          SYMFONY_CLI_VERSION: 5.17.1
          SYMFONY_CLI_LINUX_AMD64_SHA256: 526c26e029427a94f275f06298a12119ed95c7df037ca13b93f29405740d2f4e
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/symfony-cli_linux_amd64.tar.gz"
          curl --fail --location --show-error --silent \
            --retry 5 --retry-delay 2 --retry-max-time 120 \
            "https://github.com/symfony-cli/symfony-cli/releases/download/v${SYMFONY_CLI_VERSION}/symfony-cli_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${SYMFONY_CLI_LINUX_AMD64_SHA256}" "${archive}" | sha256sum -c -
          mkdir -p "${HOME}/.symfony5/bin"
          tar -xzf "${archive}" -C "${HOME}/.symfony5/bin" symfony
          chmod +x "${HOME}/.symfony5/bin/symfony"

      - name: Composer validate
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: composer validate

      - name: Check symfony requirements
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: /home/runner/.symfony5/bin/symfony check:requirements

      - name: Symfony security check
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: /home/runner/.symfony5/bin/symfony security:check
