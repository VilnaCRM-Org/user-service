name: CLI testing

on:
  pull_request:
    branches: ['main']

jobs:
  bats_core_tests:
    runs-on: ubuntu-latest
    name: Run Bats Core Tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: ${{ vars.PHP_VERSION }}

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Start Application
        run: make start

      - name: Setup Bats and bats libs
        uses: bats-core/bats-action@472edde1138d59aca53ff162fb8d996666d21e4a

      - name: Install Bats plugins
        run: mkdir -p tests/CLI/bats/test_helper && cd tests/CLI/bats/test_helper &&
          git clone https://github.com/bats-core/bats-support.git &&
          git clone https://github.com/bats-core/bats-assert.git

      - name: Run Bats tests
        run: make bats
