name: CLI testing

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  bats_core_tests:
    runs-on: ubuntu-latest
    name: Run Bats Core Tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Docker
        uses: docker/setup-docker-action@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PHP_VERSION }}

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Start Application
        run: make start

      - name: Setup Bats and bats libs
        uses: bats-core/bats-action@2.0.0
        with:
          bats-version: 1.13.0

      - name: Install Bats plugins
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-support.git tests/CLI/bats/bats-support
          git clone --depth 1 https://github.com/bats-core/bats-assert.git tests/CLI/bats/bats-assert

      - name: Run Bats tests
        run: make bats
