name: CLI testing

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  bats_core_tests:
    runs-on: ubuntu-latest
    name: Run Bats Core Tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: ${{ vars.PHP_VERSION }}

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Start Application
        run: make start

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Install Bats plugins
        run: |
          rm -rf tests/CLI/bats/bats-support tests/CLI/bats/bats-assert
          for plugin in bats-support bats-assert; do
            for attempt in 1 2 3; do
              if git clone --depth 1 "https://github.com/bats-core/${plugin}.git" "tests/CLI/bats/${plugin}"; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi

              sleep $((attempt * 10))
            done
          done

      - name: Run Bats tests
        run: make bats
