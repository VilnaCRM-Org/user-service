name: CLI testing

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  bats_core_tests:
    runs-on: ubuntu-latest
    name: Run Bats Core Tests
    steps:
      - name: Dependabot skip
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: echo "Skipping Bats for Dependabot PR"

      - name: Checkout Repository
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          php-version: ${{ vars.PHP_VERSION }}

      - name: Install Dependencies
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Start Application
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: make start

      - name: Setup Bats and bats libs
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: bats-core/bats-action@2.0.0
        with:
          bats-version: 1.13.0

      - name: Install Bats plugins
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          git clone https://github.com/bats-core/bats-support.git tests/CLI/bats/bats-support
          git clone https://github.com/bats-core/bats-assert.git tests/CLI/bats/bats-assert

      - name: Monitor MongoDB lifecycle
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          docker events \
            --filter type=container \
            --filter label=com.docker.compose.service=database \
            --format '{{.Time}} {{.Action}} exit={{.Actor.Attributes.exitCode}}' \
            > "$RUNNER_TEMP/bats-database-events.log" 2>/dev/null &
          echo $! > "$RUNNER_TEMP/bats-database-events.pid"

      - name: Run Bats tests
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: make bats

      - name: Report MongoDB lifecycle on failure
        if: ${{ failure() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          if [ -f "$RUNNER_TEMP/bats-database-events.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/bats-database-events.pid")" || true
          fi
          if [ -s "$RUNNER_TEMP/bats-database-events.log" ]; then
            cat "$RUNNER_TEMP/bats-database-events.log"
          else
            echo "No MongoDB lifecycle events captured during Bats."
          fi

      - name: Stop MongoDB lifecycle monitor
        if: ${{ always() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          if [ -f "$RUNNER_TEMP/bats-database-events.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/bats-database-events.pid")" || true
          fi
