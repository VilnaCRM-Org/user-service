name: Static analysis for load tests

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 21

      - name: Cache pnpm dependencies
        id: cache-pnpm-dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: tests/Load/node_modules
          key: ${{ runner.os }}-dependencies-${{
            hashFiles('tests/Load/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dependencies-

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: tests/Load/
        run: pnpm i --frozen-lockfile
        if: steps.cache-pnpm-dependencies.outputs.cache-hit != 'true'

      - name: Run linter
        working-directory: tests/Load/
        run: pnpm eslint
