name: Load testing

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  load-tests:
    name: K6
    runs-on: ubuntu-latest

    env:
      COMPOSE_PROJECT_NAME: user-service-load-tests
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml:docker-compose.load-tests.yml
      LOAD_TEST_COMPOSE_PROJECT: user-service-load-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Run load tests
        run: make load-tests
